<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fbff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f1ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="500" fill="url(#bgGradient)"/>
  
  <!-- Head -->
  <circle cx="200" cy="80" r="35" fill="#d4a574" stroke="#8b6f47" stroke-width="2"/>
  
  <!-- Neck -->
  <rect x="190" y="110" width="20" height="15" fill="#d4a574" stroke="#8b6f47" stroke-width="2" rx="3"/>
  
  <!-- Body -->
  <rect x="160" y="125" width="80" height="90" fill="#2563eb" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  
  <!-- Left Arm Up -->
  <g>
    <line x1="160" y1="140" x2="80" y2="60" stroke="#d4a574" stroke-width="16" stroke-linecap="round"/>
    <circle cx="80" cy="60" r="12" fill="#d4a574" stroke="#8b6f47" stroke-width="2"/>
  </g>
  
  <!-- Right Arm Up -->
  <g>
    <line x1="240" y1="140" x2="320" y2="60" stroke="#d4a574" stroke-width="16" stroke-linecap="round"/>
    <circle cx="320" cy="60" r="12" fill="#d4a574" stroke="#8b6f47" stroke-width="2"/>
  </g>
  
  <!-- Left Leg Out -->
  <g>
    <line x1="175" y1="215" x2="100" y2="300" stroke="#4b5563" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="100" cy="310" rx="14" ry="18" fill="#333333" stroke="#1a1a1a" stroke-width="2"/>
  </g>
  
  <!-- Right Leg Out -->
  <g>
    <line x1="225" y1="215" x2="300" y2="300" stroke="#4b5563" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="300" cy="310" rx="14" ry="18" fill="#333333" stroke="#1a1a1a" stroke-width="2"/>
  </g>
  
  <!-- Motion lines for jumping effect -->
  <g opacity="0.4">
    <path d="M 50 200 Q 40 150 45 100" stroke="#2563eb" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
    <path d="M 350 200 Q 360 150 355 100" stroke="#2563eb" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Exercise label -->
  <text x="200" y="450" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#0b1220">
    Jumping Jack
  </text>
</svg>
