<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fbff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f1ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="500" fill="url(#bgGradient2)"/>
  
  <!-- Head -->
  <circle cx="200" cy="80" r="35" fill="#d4a574" stroke="#8b6f47" stroke-width="2"/>
  
  <!-- Neck -->
  <rect x="190" y="110" width="20" height="15" fill="#d4a574" stroke="#8b6f47" stroke-width="2" rx="3"/>
  
  <!-- Body (leaning forward in squat) -->
  <rect x="160" y="130" width="80" height="85" fill="#2563eb" stroke="#1d4ed8" stroke-width="2" rx="8" transform="rotate(-15 200 165)"/>
  
  <!-- Left Arm Down -->
  <g>
    <line x1="170" y1="210" x2="140" y2="280" stroke="#d4a574" stroke-width="16" stroke-linecap="round"/>
    <circle cx="140" cy="290" r="12" fill="#d4a574" stroke="#8b6f47" stroke-width="2"/>
  </g>
  
  <!-- Right Arm Down -->
  <g>
    <line x1="230" y1="210" x2="260" y2="280" stroke="#d4a574" stroke-width="16" stroke-linecap="round"/>
    <circle cx="260" cy="290" r="12" fill="#d4a574" stroke="#8b6f47" stroke-width="2"/>
  </g>
  
  <!-- Left Leg (bent knee squat position) -->
  <g>
    <path d="M 180 215 L 160 310" stroke="#4b5563" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M 160 310 L 155 360" stroke="#4b5563" stroke-width="16" stroke-linecap="round" fill="none"/>
    <ellipse cx="145" cy="370" rx="14" ry="18" fill="#333333" stroke="#1a1a1a" stroke-width="2"/>
  </g>
  
  <!-- Right Leg (bent knee squat position) -->
  <g>
    <path d="M 220 215 L 240 310" stroke="#4b5563" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M 240 310 L 245 360" stroke="#4b5563" stroke-width="16" stroke-linecap="round" fill="none"/>
    <ellipse cx="255" cy="370" rx="14" ry="18" fill="#333333" stroke="#1a1a1a" stroke-width="2"/>
  </g>
  
  <!-- Ground line -->
  <line x1="50" y1="390" x2="350" y2="390" stroke="#d1d5db" stroke-width="3"/>
  
  <!-- Strength indicator lines -->
  <g opacity="0.3">
    <path d="M 100 200 L 80 150" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M 300 200 L 320 150" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Exercise label -->
  <text x="200" y="450" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#0b1220">
    Squat
  </text>
</svg>
